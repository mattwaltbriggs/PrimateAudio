<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4EC3C7"/>
      <stop offset="1" stop-color="#1F7A8C"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A5A38"/>
      <stop offset="1" stop-color="#5E3A22"/>
    </linearGradient>
    <radialGradient id="muzzle" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FBE7CC"/>
      <stop offset="1" stop-color="#E8C49C"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#1B1F27"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#00000022" stroke-width="6"/>

  <g filter="url(#soft)">
    <!-- ears -->
    <circle cx="262" cy="500" r="104" fill="url(#fur)"/>
    <circle cx="762" cy="500" r="104" fill="url(#fur)"/>
    <circle cx="262" cy="500" r="58" fill="#F0CFA8"/>
    <circle cx="762" cy="500" r="58" fill="#F0CFA8"/>

    <!-- head -->
    <ellipse cx="512" cy="486" rx="246" ry="236" fill="url(#fur)"/>

    <!-- face patch -->
    <path d="M512 300
             C 380 300, 330 400, 330 500
             C 330 622, 420 700, 512 700
             C 604 700, 694 622, 694 500
             C 694 400, 644 300, 512 300 Z"
          fill="url(#muzzle)"/>

    <!-- brows -->
    <path d="M372 414 Q430 388 470 414" stroke="#5E3A22" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M652 414 Q594 388 554 414" stroke="#5E3A22" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="416" cy="462" r="34" fill="#241812"/>
    <circle cx="608" cy="462" r="34" fill="#241812"/>
    <circle cx="426" cy="450" r="11" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="618" cy="450" r="11" fill="#FFFFFF" opacity="0.9"/>

    <!-- nostrils -->
    <ellipse cx="476" cy="566" rx="15" ry="21" fill="#6B4025"/>
    <ellipse cx="548" cy="566" rx="15" ry="21" fill="#6B4025"/>

    <!-- smile -->
    <path d="M432 626 Q512 684 592 626" stroke="#6B4025" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <!-- headphones (audio) -->
  <path d="M232 452 A 280 280 0 0 1 792 452" stroke="url(#band)" stroke-width="42" fill="none" stroke-linecap="round"/>
  <g filter="url(#soft)">
    <rect x="176" y="426" width="102" height="184" rx="50" fill="url(#band)"/>
    <rect x="746" y="426" width="102" height="184" rx="50" fill="url(#band)"/>
  </g>

  <!-- waveform on the ear cups -->
  <g stroke="#4EC3C7" stroke-width="9" stroke-linecap="round">
    <line x1="212" y1="500" x2="212" y2="536"/>
    <line x1="227" y1="486" x2="227" y2="550"/>
    <line x1="242" y1="500" x2="242" y2="536"/>

    <line x1="782" y1="500" x2="782" y2="536"/>
    <line x1="797" y1="486" x2="797" y2="550"/>
    <line x1="812" y1="500" x2="812" y2="536"/>
  </g>
</svg>